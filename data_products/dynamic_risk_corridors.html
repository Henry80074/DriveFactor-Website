function hexToRgb(h){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return [r,g,b];
}
function interpStops(stops,t){
  t=Math.max(0,Math.min(1,t));
  const n=stops.length-1;
  const idx=Math.min(Math.floor(t*n),n-1);
  const f=t*n-idx;
  const [r1,g1,b1]=hexToRgb(stops[idx]);
  const [r2,g2,b2]=hexToRgb(stops[idx+1]);
  return `rgb(${Math.round(r1+f*(r2-r1))},${Math.round(g1+f*(g2-g1))},${Math.round(b1+f*(b2-b1))})`;
}
// green → yellow → red  (crash density / risk maps)
function _rampColor(t){ return interpStops(['#1a9641','#a6d96a','#ffffbf','#fdae61','#d7191c'],t); }
// blue → green → yellow → red  (absolute risk / VKT — full safety ramp)
function _riskRamp(t){ return interpStops(['#2166ac','#1a9641','#ffffbf','#d7191c'],t); }
// grey → yellow → orange → red  (sun glare — no green)
function _glareRamp(t){ return interpStops(['#d1d5db','#e5e7eb','#fef08a','#f97316','#dc2626'],t); }
// light-blue → dark-blue  (absolute risk / VKT)
function _blueRamp(t){ return interpStops(['#deebf7','#9ecae1','#4292c6','#2171b5','#084594'],t); }
// diverging blue→slate→red  (OR curves / dynamic multiplier)
// Centre is #94a3b8 (slate-400) so baseline OR=1.0 roads are clearly visible
// against the white Carto basemap.
function _divRamp(t){ return interpStops(['#1d4ed8','#60a5fa','#94a3b8','#fb923c','#b91c1c'],t); }
// alias for OR (same diverging ramp)
function _orToT(v){const lo=0.85,hi=1.6;if(v<=lo)return 0;if(v>=hi)return 1;return Math.log(v/lo)/Math.log(hi/lo);}
function colOR(v){ return _divRamp(_orToT(v)); }

  attribution:'&copy; OpenStreetMap &copy; CartoDB',maxZoom:19
}).addTo(map);

// Each corridor feature has all_latlngs: array of polyline coordinate arrays
FEATS.forEach(f=>{
  if(!f.all_latlngs||!f.all_latlngs.length) return;
  const w = f.highway==='motorway'||f.highway==='trunk'?5
          : f.highway==='primary'||f.highway==='secondary'?4:3;
  f.all_latlngs.forEach(ll=>{
    if(!ll||ll.length<2) return;
    const line = L.polyline(ll,{color:'#d1d5db',weight:w,opacity:0.88}).addTo(map);

    lines.push(line);

function v5Mult(rt,dt,mo,hr,pi){
  const pk=String(Math.round(P_BINS[pi]*100));
  const m=V5[rt]?.[dt]?.[String(mo)]?.[String(hr)]?.[pk];
  return (m!==undefined)?m:1.0;
}

function computeRisk(f, flowFrac, mult){
  if(f.crash_rate_per_veh > 0 && f.aadf > 0)
    return f.crash_rate_per_veh * f.aadf * flowFrac * mult;
  return f.base_cpk * mult * flowFrac * 24 / 8760;
}

(function initNormBounds(){
  const baseFlowFrac = HOURLY_PROFILE.Weekday[8];
  const risks = lines.map(l=>{
    const mult = v5Mult(l._feat.road_type,'Weekday',3,8,0);
    return computeRisk(l._feat, baseFlowFrac, mult);
  }).filter(r=>r>0).sort((a,b)=>a-b);
  const n = risks.length;
  window._NORM_LO = risks[Math.floor(n*0.05)] || risks[0] || 1e-12;
  window._NORM_HI = risks[Math.floor(n*0.95)] || risks[n-1] || window._NORM_LO*2;
})();

  const featRisk = new Map();
  lines.forEach(l=>{
    const f = l._feat;
    if(!featRisk.has(f)){
      const mult = v5Mult(f.road_type,dt,mo,hr,pi);
      featRisk.set(f, {mult, risk: computeRisk(f, flowFrac, mult)});
    }
  });

  const lo = window._NORM_LO, hi = window._NORM_HI;
  const range = hi - lo;

  // Pass 2: colour + tooltip
  let sumRisk=0, n=0;
  lines.forEach(l=>{
    const f=l._feat;
    const {mult, risk: risk_per_km_hr} = featRisk.get(f);
    const t = Math.max(0, Math.min(1, (risk_per_km_hr - lo) / range));
    l.setStyle({color:_rampColor(t), weight:l._w, opacity:0.88});
    const label = f.road_name||f.ref_type||f.highway;
    l.bindTooltip(`
      <div class="tt-title">${label}</div>
      <div class="tt-sub">${f.road_type} · ${f.highway} · ${f.len_km.toFixed(2)} km · ${f.speed_limit||'?'} mph · ${f.n_segs} section${f.n_segs>1?'s':''}</div>
      <hr class="tt-div">
      <div class="tt-row"><span>AADF (vehicles/day)</span><span class="tt-val">${Math.round(f.aadf).toLocaleString()}</span></div>
      <div class="tt-row"><span>Hourly flow</span><span class="tt-val">${Math.round(f.aadf * flowFrac)} veh/hr</span></div>
      <div class="tt-row"><span>Conditions multiplier</span><span class="tt-val">${mult.toFixed(3)}×</span></div>
      <div class="tt-row"><span>Risk / km / hr</span><span class="tt-val">${risk_per_km_hr.toExponential(3)}</span></div>
    `,{className:'df-tooltip',sticky:true});
    l.on('mouseover',function(){this.setStyle({weight:this._w+2})});
    l.on('mouseout',function(){l.setStyle({color:_rampColor(t),weight:l._w,opacity:0.88})});
    sumRisk+=risk_per_km_hr; n++;
  });
  const avg = n>0?(sumRisk/n):0;
  const el=document.getElementById('mult-lbl');
  el.textContent=avg.toExponential(2);
  el.style.color=avg>hi*0.7?'#ef4444':avg>hi*0.3?'#f59e0b':'#22c55e';
}

recalc();
</script>
<button id="mobile-ctrl-btn" onclick="document.getElementById('ctrl-panel').classList.toggle('open')">&#9881; Controls</button>
</body>
